services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    

  grobid:
    image: grobid/grobid-crf:0.8.1
    container_name: rag_grobid
    ports:
      - "8070:8070"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:-UseContainerSupport"
    ulimits:
      core: 0
    restart: unless-stopped
